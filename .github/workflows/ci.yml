name: CI

on:
  pull_request:
  push:
    branches:
      - master

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  typescript-lint:
    name: TypeScript / lint & format
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: languages/typescript
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: languages/typescript/.nvmrc
          cache: npm
          cache-dependency-path: languages/typescript/package-lock.json

      - run: npm ci

      - run: npm run lint

      - run: npm run format:check

  typescript-typecheck:
    name: TypeScript / typecheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: languages/typescript
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: languages/typescript/.nvmrc
          cache: npm
          cache-dependency-path: languages/typescript/package-lock.json

      - run: npm ci

      - run: npm run typecheck

  typescript-test:
    name: TypeScript / test (node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: languages/typescript
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: languages/typescript/package-lock.json

      - run: npm ci

      - run: npm run test

  python-lint:
    name: Python / lint & format
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: languages/python
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: languages/python/uv.lock
          python-version: '3.13'

      - run: uv sync --locked

      - run: uv run ruff check .

      - run: uv run ruff format --check .

  python-typecheck:
    name: Python / typecheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: languages/python
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: languages/python/uv.lock
          python-version: '3.13'

      - run: uv sync --locked

      - run: uv run mypy

  python-test:
    name: Python / test (python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: languages/python
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.9', '3.10', '3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: languages/python/uv.lock
          python-version: ${{ matrix.python-version }}

      - run: uv sync --locked

      - run: uv run pytest
