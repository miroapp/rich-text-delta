name: CI

on:
  pull_request:
  push:
    branches:
      - master

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  typescript-lint:
    name: TypeScript / lint & format
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: languages/typescript
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: languages/typescript/.nvmrc
          cache: npm
          cache-dependency-path: languages/typescript/package-lock.json

      - run: npm ci

      - run: npm run lint

      - run: npm run format:check

  typescript-typecheck:
    name: TypeScript / typecheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: languages/typescript
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: languages/typescript/.nvmrc
          cache: npm
          cache-dependency-path: languages/typescript/package-lock.json

      - run: npm ci

      - run: npm run typecheck

  typescript-test:
    name: TypeScript / test (node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: languages/typescript
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: languages/typescript/package-lock.json

      - run: npm ci

      - run: npm run test
