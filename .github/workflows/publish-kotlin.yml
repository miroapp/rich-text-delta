name: Publish Kotlin

on:
  release:
    types: [published]

concurrency:
  group: publish-kotlin-${{ github.event.release.tag_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish-kotlin:
    name: Publish Kotlin to Maven Central
    if: startsWith(github.event.release.tag_name, 'kotlin/v')
    runs-on: ubuntu-latest
    environment: maven-central-publish
    defaults:
      run:
        working-directory: languages/kotlin
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}
          fetch-depth: 0 # need history to verify the tag is on master

      - name: Verify tag looks like a version tag
        env:
          TAG_NAME: ${{ github.event.release.tag_name }}
        run: |
          case "$TAG_NAME" in
            kotlin/v[0-9]*.[0-9]*.[0-9]*) ;;
            *)
              echo "::error::Tag ${TAG_NAME} is not a Kotlin release tag. Release tags must look like kotlin/v1.2.3."
              exit 1
              ;;
          esac

      - name: Verify tag is on master
        env:
          TAG_NAME: ${{ github.event.release.tag_name }}
        run: |
          tag_sha="$(git rev-parse HEAD)"
          git fetch --no-tags origin master:refs/remotes/origin/master
          if ! git merge-base --is-ancestor "$tag_sha" origin/master; then
            echo "::error::Tag ${TAG_NAME} ($tag_sha) is not contained in origin/master. Refusing to publish."
            exit 1
          fi

      - name: Verify tag matches gradle.properties version
        env:
          TAG_NAME: ${{ github.event.release.tag_name }}
        run: |
          tag_version="${TAG_NAME#kotlin/v}"
          pkg_version="$(sed -n 's/^version=//p' gradle.properties)"
          if [ "$pkg_version" != "$tag_version" ]; then
            echo "::error::Tag ${TAG_NAME} does not match languages/kotlin/gradle.properties version ${pkg_version}."
            exit 1
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: true

      - run: ./gradlew build

      - name: Upload to staging
        run: ./gradlew publishMavenPublicationToMavenCentralRepository
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_KEY_PASSWORD }}

      # The staging API only sees the upload once it is handed to the Central Portal. It
      # matches staging repositories by the uploader's IP, so this must run in the same job.
      - name: Release from staging
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
        run: |
          namespace="$(sed -n 's/^group=//p' gradle.properties)"
          token="$(printf '%s:%s' "$MAVEN_CENTRAL_USERNAME" "$MAVEN_CENTRAL_PASSWORD" | base64 -w0)"
          echo "::add-mask::$token"
          curl --fail-with-body --silent --show-error -X POST \
            -H "Authorization: Bearer $token" \
            "https://ossrh-staging-api.central.sonatype.com/manual/upload/defaultRepository/${namespace}?publishing_type=automatic"
