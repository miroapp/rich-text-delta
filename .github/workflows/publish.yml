name: Publish

on:
  release:
    types: [published]

concurrency:
  group: publish-${{ github.event.release.tag_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    environment: npm-publish
    permissions:
      contents: read
      id-token: write # required for npm provenance
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}
          fetch-depth: 0 # need history to verify the tag is on master

      - name: Verify tag looks like a version tag
        env:
          TAG_NAME: ${{ github.event.release.tag_name }}
        run: |
          case "$TAG_NAME" in
            v[0-9]*) ;;
            *)
              echo "::error::Tag ${TAG_NAME} is not a release tag. Release tags must look like v1.2.3."
              exit 1
              ;;
          esac

      - name: Verify tag is on master
        env:
          TAG_NAME: ${{ github.event.release.tag_name }}
        run: |
          tag_sha="$(git rev-parse HEAD)"
          git fetch --no-tags origin master:refs/remotes/origin/master
          if ! git merge-base --is-ancestor "$tag_sha" origin/master; then
            echo "::error::Tag ${TAG_NAME} ($tag_sha) is not contained in origin/master. Refusing to publish."
            exit 1
          fi

      - name: Verify tag matches package.json version
        env:
          TAG_NAME: ${{ github.event.release.tag_name }}
        run: |
          tag_version="${TAG_NAME#v}"
          pkg_version="$(node -p "require('./package.json').version")"
          if [ "$pkg_version" != "$tag_version" ]; then
            echo "::error::Tag ${TAG_NAME} does not match package.json version ${pkg_version}."
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org

      - run: npm ci

      - run: npm run lint

      - run: npm run format:check

      - run: npm run typecheck

      - run: npm run test

      - run: npm run build

      - name: Publish
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
