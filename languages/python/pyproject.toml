[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rich-text-delta"
version = "0.1.0"
description = "Format for representing rich text documents and changes."
readme = "README.md"
requires-python = ">=3.9"
license = "BSD-3-Clause"
license-files = ["LICENSE", "NOTICE.txt"]
authors = [{ name = "Miro" }]
keywords = ["delta", "operational transform", "ot", "rich text"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Text Processing :: Markup",
  "Typing :: Typed",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/miroapp/rich-text-delta"
Issues = "https://github.com/miroapp/rich-text-delta/issues"
Repository = "https://github.com/miroapp/rich-text-delta"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.9",
    "mypy>=1.14",
    "pyyaml>=6.0.3",
    "types-pyyaml>=6.0.12.20250915",
]

[tool.hatch.build.targets.wheel]
packages = ["src/rich_text_delta"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "README.md", "LICENSE", "NOTICE.txt"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "A"]
ignore = [
  # `Delta.filter`, `Delta.map`, `Delta.delete` and `op.length` mirror the TypeScript
  # API, which shadows Python builtins.
  "A001",
  "A002",
  "A003",
  # `typing.Dict`/`Union`/`Optional` spellings: annotations of TypedDict fields and
  # module-level aliases are evaluated at runtime, where PEP 604 unions need 3.10.
  "UP006",
  "UP007",
  "UP035",
  "UP045",
]

[tool.ruff.lint.per-file-ignores]
# The fast-diff port keeps the upstream structure, including its long branches.
"src/rich_text_delta/_fast_diff.py" = ["B905", "E501"]

[tool.ruff.format]
quote-style = "single"

[tool.mypy]
# No `python_version`: mypy only supports 3.10 and up, while the package still runs on
# 3.9. Ruff's `target-version` keeps the syntax within the 3.9 floor.
files = ["src", "tests"]
mypy_path = "tests"
disallow_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true

[tool.pytest.ini_options]
testpaths = ["tests"]
